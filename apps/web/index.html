<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusinessFlow AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
    <script type="module">
      import React from 'https://esm.sh/react@18.2.0'
      import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client'

      const API_BASE = 'https://businessflow-api.marketmesh-api.workers.dev'

      async function fetchApi(path, opts = {}) {
        const res = await fetch(`${API_BASE}${path}`, { ...opts, headers: { 'Content-Type': 'application/json', ...opts.headers } })
        if (!res.ok) throw new Error(`API ${path}: ${res.status}`)
        return res.json()
      }

      function App() {
        const [step, setStep] = React.useState('intake')
        const [inquiries, setInquiries] = React.useState([])
        const [policies, setPolicies] = React.useState([])
        const [selectedInquiry, setSelectedInquiry] = React.useState(null)
        const [draft, setDraft] = React.useState(null)
        const [newText, setNewText] = React.useState('')
        const [loading, setLoading] = React.useState(false)

        React.useEffect(() => {
          Promise.all([
            fetchApi('/api/inquiries'),
            fetchApi('/api/policies')
          ]).then(([inqs, pols]) => {
            setInquiries(inqs)
            setPolicies(pols)
          })
        }, [])

        const onSubmit = async () => {
          if (!newText.trim()) return
          setLoading(true)
          try {
            const result = await fetchApi('/api/inquiries', {
              method: 'POST',
              body: JSON.stringify({ text: newText })
            })
            setInquiries([result.inquiry, ...inquiries])
            setSelectedInquiry(result.inquiry)
            setDraft(null)
            setNewText('')
            setStep('detail')
          } finally { setLoading(false) }
        }

        const onDraft = async () => {
          setLoading(true)
          try {
            const result = await fetchApi('/api/draft', {
              method: 'POST',
              body: JSON.stringify({ inquiry_id: selectedInquiry.id })
            })
            setDraft(result.draft)
          } finally { setLoading(false) }
        }

        const onDecide = async (approved) => {
          setLoading(true)
          try {
            await fetchApi(`/api/inquiries/${selectedInquiry.id}/decide`, {
              method: 'POST',
              body: JSON.stringify({ actor: 'recruiter-demo', approved, reason: approved ? 'Policy-compliant' : 'Needs human review' })
            })
            // Refresh
            const inqs = await fetchApi('/api/inquiries')
            setInquiries(inqs)
            setStep('intake')
          } finally { setLoading(false) }
        }

        return (
          <div className="min-h-screen">
            <nav className="bg-white border-b shadow-sm">
              <div className="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 bg-green-600 rounded-lg flex items-center justify-center text-white font-bold">B</div>
                  <span className="font-bold text-xl text-gray-800">BusinessFlow AI</span>
                </div>
                <div className="text-sm text-gray-600">Demo mode • Sandbox only</div>
              </div>
            </nav>

            <div className="max-w-5xl mx-auto px-4 py-6">
              {step === 'intake' && (
                <>
                  <div className="bg-white rounded-lg shadow-sm border p-6 mb-8">
                    <h1 className="text-2xl font-bold mb-2">Customer Inquiry Intake</h1>
                    <p className="text-gray-600 mb-4">Submit a synthetic customer inquiry to see classification, policy lookup, and draft generation.</p>
                    <div className="space-y-4">
                      <textarea
                        className="w-full p-4 border rounded-lg font-mono text-sm"
                        rows={5}
                        placeholder="e.g. I need a refund for my order #12345, I was double charged."
                        value={newText}
                        onChange={(e) => setNewText(e.target.value)}
                      />
                      <button
                        onClick={onSubmit}
                        disabled={loading || !newText.trim()}
                        className="px-6 py-3 bg-green-600 text-white rounded hover:bg-green-700 disabled:opacity-50"
                      >
                        {loading ? 'Processing...' : 'Submit Inquiry'}
                      </button>
                    </div>
                    <div className="mt-6 pt-6 border-t">
                      <h2 className="font-bold mb-3">Recent Inquiries</h2>
                      <div className="space-y-3">
                        {inquiries.slice(0, 5).map(inq => (
                          <div key={inq.id} className="p-3 border rounded-lg bg-white cursor-pointer hover:bg-gray-50" onClick={() => {
                            setSelectedInquiry(inq)
                            setStep('detail')
                          }}>
                            <div className="flex justify-between items-start">
                              <div className="font-medium text-gray-900 truncate max-w-[60%]" title={inq.text}>{inq.text}</div>
                              <span className={`px-2 py-0.5 rounded-full text-xs font-medium ${inq.category === 'billing' ? 'bg-amber-100 text-amber-700' : inq.category === 'escalation' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700`} `}>
                                {inq.category}
                              </span>
                            </div>
                            <div className="text-xs text-gray-500 mt-1">{inq.urgency} urgency • {inq.state}</div>
                          </div>
                        ))}
                        {inquiries.length === 0 && <div className="text-center py-4 text-gray-400 text-sm">No inquiries yet</div>}
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                    {policies.map(p => (
                      <div key={p.source_id} className="p-4 border rounded-lg bg-white">
                        <div className="font-medium">{p.topic}</div>
                        <div className="text-xs text-gray-500 mb-2">v{p.revision}</div>
                        <div className="text-sm text-gray-700">{p.approved_text}</div>
                      </div>
                    ))}
                  </div>
                </>
              )}

              {step === 'detail' && selectedInquiry && (
                <>
                  <div className="flex justify-between items-center mb-6">
                    <h1 className="text-2xl font-bold">Inquiry Detail</h1>
                    <button onClick={() => setStep('intake')} className="text-sm text-gray-600 hover:underline">← Back</button>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-2">
                      <div className="bg-white rounded-lg shadow-sm border p-6">
                        <h2 className="font-bold mb-4">Inquiry</h2>
                        <div className="p-4 border rounded-lg bg-gray-50 font-mono text-sm whitespace-pre-wrap mb-4">{selectedInquiry.text}</div>
                        <div className="grid grid-cols-3 gap-4 text-sm mb-6">
                          <div>
                            <div className="text-xs text-gray-500 uppercase">Category</div>
                            <div className="font-medium">{selectedInquiry.category}</div>
                          </div>
                          <div>
                            <div className="text-xs text-gray-500 uppercase">Urgency</div>
                            <div className="font-medium">{selectedInquiry.urgency}</div>
                          </div>
                          <div>
                            <div className="text-xs text-gray-500 uppercase">State</div>
                            <div className="font-medium">{selectedInquiry.state}</div>
                          </div>
                        </div>
                        <div className="flex gap-3">
                          <button
                            onClick={onDraft}
                            disabled={loading || draft}
                            className="flex-1 py-3 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50"
                          >
                            {loading ? 'Drafting...' : 'Generate Draft'}
                          </button>
                          <button
                            onClick={() => setStep('intake')}
                            className="px-6 py-3 border rounded hover:bg-gray-50"
                          >
                            Cancel
                          </button>
                        </div>
                      </div>
                    </div>

                    <div className="lg:col-span-1">
                      <div className="bg-white rounded-lg shadow-sm border p-6 sticky top-6">
                        <h2 className="font-bold mb-4">Actions</h2>
                        {!draft && (
                          <button
                            onClick={onDraft}
                            disabled={loading}
                            className="w-full py-3 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50"
                          >
                            Generate Draft Reply
                          </button>
                        )}
                        {draft && (
                          <>
                            <div className="space-y-4">
                              <div className="p-4 border rounded-lg bg-blue-50">
                                <div className="font-medium mb-2">Draft Reply</div>
                                <div className="text-sm whitespace-pre-wrap">{draft.answer}</div>
                                <div className="mt-2 text-xs text-gray-500">Source: {draft.citations}</div>
                                {draft.unsupported_claims > 0 && (
                                  <div className="mt-2 text-xs text-red-600">{draft.unsupported_claims} unsupported claim(s) flagged</div>
                                )}
                              </div>
                              <div className="flex gap-2">
                                <button
                                  onClick={() => onDecide(true)}
                                  className="flex-1 py-3 bg-green-600 text-white rounded hover:bg-green-700"
                                >
                                  Approve Reply
                                </button>
                                <button
                                  onClick={() => onDecide(false)}
                                  className="flex-1 py-3 bg-red-600 text-white rounded hover:bg-red-700"
                                >
                                  Escalate
                                </button>
                              </div>
                            </div>
                          </>
                        )}
                      </div>
                    </div>
                  </div>
                </>
              )}
            </div>
          </div>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
