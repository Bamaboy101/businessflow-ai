<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusinessFlow AI — Customer Inquiry & Approved Replies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; margin: 0; background: #f9fafb; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/javascript">
      const { useState, useEffect } = React;

      const API_BASE = 'https://businessflow-api.marketmesh-api.workers.dev';

      // ---- Anonymous session -------------------------------------------------
      // The server issues an opaque session id; we persist it per browser profile
      // so a reload keeps the same visitor identity, while a different browser
      // (or private window) gets its own isolated records.
      const SESSION_KEY = 'demo-session-id';
      let SESSION_ID = null;
      try { SESSION_ID = localStorage.getItem(SESSION_KEY); } catch (e) {}

      function adoptSession(res) {
        const issued = res.headers.get('x-demo-session');
        if (issued && issued !== SESSION_ID) {
          SESSION_ID = issued;
          try { localStorage.setItem(SESSION_KEY, issued); } catch (e) {}
        }
      }

      function sessionHeaders(extra) {
        const h = Object.assign({}, extra || {});
        if (SESSION_ID) h['x-demo-session'] = SESSION_ID;
        return h;
      }

      async function api(path, opts = {}) {
        const headers = sessionHeaders(opts.headers);
        // Let the browser set the multipart boundary for FormData bodies.
        if (!(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
        const res = await fetch(`${API_BASE}${path}`, Object.assign({}, opts, { headers }));
        adoptSession(res);
        if (!res.ok) {
          let detail = '';
          try { const j = await res.json(); detail = j.error || j.message || ''; } catch (e) {}
          throw new Error(`${res.status} ${detail || res.statusText} (${path})`);
        }
        return res.json();
      }

      function ErrorBanner({ error, onDismiss }) {
        if (!error) return null;
        return React.createElement('div', {
          role: 'alert', 'data-testid': 'error-banner',
          className: 'mb-4 p-3 rounded-lg border border-red-300 bg-red-50 text-red-800 text-sm flex justify-between items-start gap-3'
        },
          React.createElement('span', null, 'Request failed: ' + error),
          React.createElement('button', { onClick: onDismiss, className: 'underline shrink-0' }, 'Dismiss')
        );
      }

      const POLICIES = [
        { source_id: 'pol-refund-1', revision: '1.0', topic: 'refunds', approved_text: 'Refunds are available within 30 days of purchase with a valid receipt.' },
        { source_id: 'pol-shipping-1', revision: '1.0', topic: 'shipping', approved_text: 'Standard shipping arrives in 5-7 business days; express in 1-2 business days.' },
        { source_id: 'pol-billing-1', revision: '1.0', topic: 'billing', approved_text: 'Billing questions can be reviewed by requesting an itemized invoice.' },
        { source_id: 'pol-escalation-1', revision: '1.0', topic: 'escalation', approved_text: 'Unsupported or disputed claims are escalated to a human agent.' },
      ];

      function classify(text) {
        const lower = text.toLowerCase();
        const rules = [
          { category: 'sales', keywords: ['buy', 'purchase', 'pricing', 'quote', 'cost', 'plan', 'upgrade'] },
          { category: 'billing', keywords: ['refund', 'charge', 'invoice', 'receipt', 'payment', 'billing', 'double charged'] },
          { category: 'escalation', keywords: ['complaint', 'manager', 'escalate', 'fraud', 'dispute', 'lawyer'] },
          { category: 'support', keywords: ['help', 'how do', 'not working', 'broken', 'error', 'reset', 'question'] }
        ];
        let best = 'support', bestMatches = [], bestScore = 0;
        for (const rule of rules) {
          const matched = rule.keywords.filter(k => lower.includes(k));
          if (matched.length > bestScore) { bestScore = matched.length; best = rule.category; bestMatches = matched; }
        }
        return { category: best, confidence: bestScore > 0 ? Math.min(0.95, 0.6 + 0.1 * bestScore) : 0.5, matched: bestMatches };
      }

      function isEscalationTrigger(text) {
        const lower = text.toLowerCase();
        return ['refund', 'dispute', 'fraud', 'manager', 'escalate', 'cancel'].some(k => lower.includes(k));
      }

      const catColor = { sales: '#2563eb', billing: '#ca8a04', escalation: '#dc2626', support: '#16a34a' };

      function App() {
        const [inquiries, setInquiries] = useState([]);
        const [selected, setSelected] = useState(null);
        const [draft, setDraft] = useState(null);
        const [newText, setNewText] = useState('');
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState(null);
        const [sandbox, setSandbox] = useState([]);

        const refresh = async () => {
          try {
            const [inqs, pols, acts] = await Promise.all([
              api('/api/inquiries'), api('/api/policies'), api('/api/sandbox')
            ]);
            setInquiries(inqs); setPolicies(pols); setSandbox(acts);
          } catch (e) { setError(String(e.message || e)); }
        };

        useEffect(() => { refresh(); }, []);

        const [policies, setPolicies] = useState(POLICIES);

        const onSubmit = async () => {
          if (!newText.trim()) return;
          setLoading(true);
          try {
            const result = await api('/api/inquiries', {
              method: 'POST',
              body: JSON.stringify({ text: newText })
            });
            setInquiries([result.inquiry, ...inquiries]);
            setSelected(result.inquiry);
            setDraft(null);
            setNewText('');
          } catch (e) { setError(String(e.message || e)); }
          finally { setLoading(false); }
        };

        const onDraft = async () => {
          setLoading(true);
          try {
            const result = await api('/api/draft', {
              method: 'POST',
              body: JSON.stringify({ inquiry_id: selected.id })
            });
            setDraft(result.draft);
          } catch (e) { setError(String(e.message || e)); }
          finally { setLoading(false); }
        };

        const onDecide = async (approved) => {
          if (!selected) return;
          setLoading(true);
          try {
            await api(`/api/inquiries/${selected.id}/decide`, {
              method: 'POST',
              body: JSON.stringify({ actor: 'recruiter-demo', approved, reason: approved ? 'Policy-compliant' : 'Needs human review' })
            });
            setSelected(null);
            setDraft(null);
            await refresh();
          } catch (e) { setError(String(e.message || e)); }
          finally { setLoading(false); }
        };

        return React.createElement('div', { className: 'min-h-screen' },
          React.createElement('nav', { className: 'bg-white border-b shadow-sm' },
            React.createElement('div', { className: 'max-w-5xl mx-auto px-4 py-3 flex justify-between items-center' },
              React.createElement('div', { className: 'flex items-center gap-2' },
                React.createElement('div', { className: 'w-8 h-8 bg-green-600 rounded-lg flex items-center justify-center text-white font-bold' }, 'B'),
                React.createElement('span', { className: 'font-bold text-xl text-gray-800' }, 'BusinessFlow AI')
              ),
              React.createElement('div', { className: 'text-sm text-gray-600' }, 'Demo mode • Sandbox only')
            )
          ),
          React.createElement('div', { className: 'max-w-5xl mx-auto px-4 py-6' },
            React.createElement(ErrorBanner, { error: error, onDismiss: () => setError(null) }),
            !selected && React.createElement(React.Fragment, null,
              React.createElement('div', { className: 'bg-white rounded-lg shadow-sm border p-6 mb-8' },
                React.createElement('h1', { className: 'text-2xl font-bold mb-2' }, 'Customer Inquiry Intake'),
                React.createElement('p', { className: 'text-gray-600 mb-4' }, 'Submit a synthetic customer inquiry to see classification, policy lookup, and draft generation.'),
                React.createElement('div', { className: 'space-y-4' },
                  React.createElement('textarea', {
                    className: 'w-full p-4 border rounded-lg font-mono text-sm',
                    rows: 5,
                    placeholder: 'e.g. I need a refund for my order #12345, I was double charged.',
                    value: newText,
                    onChange: (e) => setNewText(e.target.value)
                  }),
                  React.createElement('button', {
                    onClick: onSubmit,
                    disabled: loading || !newText.trim(),
                    className: 'px-6 py-3 bg-green-600 text-white rounded hover:bg-green-700 disabled:opacity-50'
                  }, loading ? 'Processing...' : 'Submit Inquiry')
                ),
                React.createElement('div', { className: 'mt-6 pt-6 border-t' },
                  React.createElement('h2', { className: 'font-bold mb-3' }, 'Recent Inquiries'),
                  React.createElement('div', { className: 'space-y-3' },
                    inquiries.slice(0, 5).map(inq => React.createElement('div', {
                      key: inq.id,
                      className: 'p-3 border rounded-lg bg-white cursor-pointer hover:bg-gray-50',
                      onClick: () => { setSelected(inq); }
                    },
                      React.createElement('div', { className: 'flex justify-between items-start' },
                        React.createElement('div', { className: 'font-medium text-gray-900 truncate max-w-[60%]' }, inq.text),
                        React.createElement('span', {
                          className: `px-2 py-0.5 rounded-full text-xs font-medium ${inq.category === 'billing' ? 'bg-amber-100 text-amber-700' : inq.category === 'escalation' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`
                        }, inq.category)
                      ),
                      React.createElement('div', { className: 'text-xs text-gray-500 mt-1' }, inq.urgency + ' urgency • ' + inq.state)
                    )
                  )),
                  inquiries.length === 0 && React.createElement('div', { className: 'text-center py-4 text-gray-400 text-sm' }, 'No inquiries yet')
                )
              ),
              React.createElement('div', { className: 'bg-white rounded-lg shadow-sm border p-6 mb-8', 'data-testid': 'sandbox-panel' },
                React.createElement('h2', { className: 'font-bold mb-1' }, 'Sandbox Activity'),
                React.createElement('p', { className: 'text-xs text-gray-500 mb-3' }, 'Approved decisions and escalations are logged here. Sandbox only — no real email or CRM writes.'),
                sandbox.length === 0
                  ? React.createElement('div', { className: 'text-sm text-gray-400' }, 'No sandbox activity yet')
                  : React.createElement('div', { className: 'space-y-2' }, sandbox.slice(0, 8).map(a =>
                      React.createElement('div', { key: a.id, className: 'text-sm flex justify-between border-b pb-1' },
                        React.createElement('span', { className: 'font-medium' }, a.activity),
                        React.createElement('span', { className: 'text-gray-500 text-xs' }, new Date(a.created_utc).toLocaleString())
                      )))
              ),
              React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-4 gap-6' },
                policies.map(p => React.createElement('div', {
                  key: p.source_id,
                  className: 'p-4 border rounded-lg bg-white'
                },
                  React.createElement('div', { className: 'font-medium' }, p.topic),
                  React.createElement('div', { className: 'text-xs text-gray-500 mb-2' }, 'v' + p.revision),
                  React.createElement('div', { className: 'text-sm text-gray-700' }, p.approved_text)
                ))
              )
            ),
            selected && React.createElement(React.Fragment, null,
              React.createElement('div', { className: 'flex justify-between items-center mb-6' },
                React.createElement('h1', { className: 'text-2xl font-bold' }, 'Inquiry Detail'),
                React.createElement('button', { onClick: () => setSelected(null), className: 'text-sm text-gray-600 hover:underline' }, '← Back')
              ),
              React.createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-3 gap-6' },
                React.createElement('div', { className: 'lg:col-span-2' },
                  React.createElement('div', { className: 'bg-white rounded-lg shadow-sm border p-6' },
                    React.createElement('h2', { className: 'font-bold mb-4' }, 'Inquiry'),
                    React.createElement('div', { className: 'p-4 border rounded-lg bg-gray-50 font-mono text-sm whitespace-pre-wrap mb-4' }, selected.text),
                    React.createElement('div', { className: 'grid grid-cols-3 gap-4 text-sm mb-6' },
                      React.createElement('div', null,
                        React.createElement('div', { className: 'text-xs text-gray-500 uppercase' }, 'Category'),
                        React.createElement('div', { className: 'font-medium' }, selected.category)
                      ),
                      React.createElement('div', null,
                        React.createElement('div', { className: 'text-xs text-gray-500 uppercase' }, 'Urgency'),
                        React.createElement('div', { className: 'font-medium' }, selected.urgency)
                      ),
                      React.createElement('div', null,
                        React.createElement('div', { className: 'text-xs text-gray-500 uppercase' }, 'State'),
                        React.createElement('div', { className: 'font-medium' }, selected.state)
                      )
                    ),
                    React.createElement('div', { className: 'flex gap-3' },
                      React.createElement('button', {
                        onClick: onDraft,
                        disabled: loading || draft,
                        className: 'flex-1 py-3 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50'
                      }, loading ? 'Drafting...' : 'Generate Draft'),
                      React.createElement('button', {
                        onClick: () => setSelected(null),
                        className: 'px-6 py-3 border rounded hover:bg-gray-50'
                      }, 'Cancel')
                    )
                  )
                )
              ),
              React.createElement('div', { className: 'lg:col-span-1' },
                React.createElement('div', { className: 'bg-white rounded-lg shadow-sm border p-6 sticky top-6' },
                  React.createElement('h2', { className: 'font-bold mb-4' }, 'Actions'),
                  !draft && React.createElement('button', {
                    onClick: onDraft,
                    disabled: loading,
                    className: 'w-full py-3 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50'
                  }, 'Generate Draft Reply'),
                  draft && React.createElement(React.Fragment, null,
                    React.createElement('div', { className: 'space-y-4' },
                      React.createElement('div', { className: 'p-4 border rounded-lg bg-blue-50' },
                        React.createElement('div', { className: 'font-medium mb-2' }, 'Draft Reply'),
                        React.createElement('div', { className: 'text-sm whitespace-pre-wrap' }, draft.answer),
                        React.createElement('div', { className: 'mt-2 text-xs text-gray-500' }, 'Source: ' + draft.citations),
                        draft.unsupported_claims > 0 && React.createElement('div', { className: 'mt-2 text-xs text-red-600' }, draft.unsupported_claims + ' unsupported claim(s) flagged')
                      ),
                      React.createElement('div', { className: 'flex gap-2' },
                        React.createElement('button', {
                          onClick: () => onDecide(true),
                          className: 'flex-1 py-3 bg-green-600 text-white rounded hover:bg-green-700'
                        }, 'Approve Reply'),
                        React.createElement('button', {
                          onClick: () => onDecide(false),
                          className: 'flex-1 py-3 bg-red-600 text-white rounded hover:bg-red-700'
                        }, 'Escalate')
                      )
                    )
                  )
                )
              )
            )
          )
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(App));
    </script>
  </body>
</html>
