version: '3.8'

services:
  api:
    build: ./apps/api
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
      - NODE_ENV=production
      - AI_PROVIDER=demo
    volumes:
      - ./apps/api:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped

  web:
    build: ./apps/web
    ports:
      - "5176:5176"
    environment:
      - VITE_API_BASE=http://localhost:4003
    volumes:
      - ./apps/web:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped
